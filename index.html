<!DOCTYPE html>
<html lang="ur" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>جامعة الفرقان - Jamia Al Furqan Management System</title>
    <!-- Tailwind CSS -->
    <script src="https://cdn.tailwindcss.com"></script>
    <script>
        tailwind.config = {
            theme: {
                extend: {
                    colors: {
                        primary: '#0C5A34',
                        secondary: '#D4AF37',
                        bgLight: '#FDFDFD',
                        darkNeutral: '#1F2937',
                        slateBG: '#111827'
                    }
                }
            }
        }
    </script>
    <!-- Font Awesome Icons -->
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <!-- Google Fonts -->
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700&family=Noto+Naskh+Arabic:wght@400;500;600;700&family=Amiri:wght@400;700&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="css/custom.css">
</head>
<body class="text-darkNeutral font-sans min-h-screen flex flex-col md:flex-row transition-all duration-300">

    <script src="js/translations.js"></script>
    <script src="js/app-core.js"></script>

    <!-- SIDEBAR PANEL -->
    <aside id="sidebar-panel" class="w-full md:w-80 bg-primary text-white flex flex-col justify-between shrink-0 transition-all duration-300 shadow-2xl z-20">
        <div>
            <!-- Header Logo Section -->
            <div class="p-4 border-b border-green-800 flex flex-col items-center justify-center text-center">
                <svg class="w-20 h-20 mb-2 animate-pulse" viewBox="0 0 100 100" fill="none" xmlns="http://www.w3.org/2000/svg">
                    <!-- Crescent and Star -->
                    <path d="M50 8 C50.3 9.5, 51.5 10.5, 53 10.5 C51.2 10.5, 50 11.7, 50 13.5 C50 11.7, 48.8 10.5, 47 10.5 C48.5 10.5, 49.7 9.5, 50 8 Z" fill="#D4AF37"/>
                    <path d="M48 12.5 C49 13, 49.5 13.5, 49.5 14.5 C49.5 16, 48 17, 46 16.5 C47.5 16.5, 48.5 15.5, 48 14 C47.8 13.5, 47.2 13, 48 12.5 Z" fill="#D4AF37"/>
                    
                    <!-- Dome / Mosque Cupola -->
                    <path d="M50 16 C45 23, 37 28, 37 36 C37 39, 39 41, 41 41 C42 38, 45 35, 50 35 C55 35, 58 38, 59 41 C61 41, 63 39, 63 36 C63 28, 55 23, 50 16 Z" fill="#D4AF37"/>
                    
                    <!-- Minaret / Pen Nib morphing -->
                    <path d="M50 25 L47 34 C47 34, 48.5 35.5, 50 35.5 C51.5 35.5, 53 34, 53 34 Z" fill="#0C5A34"/>
                    <path d="M50 22 L50 32" stroke="#D4AF37" stroke-width="1"/>
                    <rect x="49" y="35" width="2" height="5" fill="#D4AF37"/>
                    
                    <!-- Open Book (Al-Quran) -->
                    <!-- Left Page -->
                    <path d="M48 51 C38 46, 28 49, 18 56 L18 66 C28 59, 38 56, 48 61 Z" fill="#D4AF37"/>
                    <!-- Right Page -->
                    <path d="M52 51 C62 46, 72 49, 82 56 L82 66 C72 59, 62 56, 52 61 Z" fill="#D4AF37"/>
                    <!-- Pages lines/highlights -->
                    <path d="M21 58 C29 53, 39 50, 47 54" stroke="#0C5A34" stroke-width="1" stroke-linecap="round"/>
                    <path d="M79 58 C71 53, 61 50, 53 54" stroke="#0C5A34" stroke-width="1" stroke-linecap="round"/>
                    
                    <!-- Book Stand / Rehal -->
                    <path d="M48 62 L32 74 L37 77 L50 66 L63 77 L68 74 L52 62 Z" fill="#D4AF37"/>
                    <path d="M42 68 C45 71, 55 71, 58 68" stroke="#D4AF37" stroke-width="1.5" fill="none"/>
                </svg>
                <h1 class="text-base font-bold tracking-wide text-secondary" id="brand-title" data-key="brandTitle">جامعة الفرقان</h1>
                <p class="text-[9px] text-green-200 mt-0.5" id="brand-subtitle" data-key="brandSubtitle">JAMIA AL FURQAN</p>
            </div>

            <!-- Navigation Links -->
            <nav class="mt-4 px-3 space-y-1 overflow-y-auto max-h-[70vh]">
                <button onclick="switchTab('dashboard', this)" class="sidebar-link w-full text-right active flex items-center gap-3 px-4 py-2.5 rounded-lg bg-green-900 text-secondary transition-all hover:bg-green-800">
                    <i class="fa-solid fa-chart-line text-base w-5 text-center"></i>
                    <span class="nav-text text-sm" data-key="dashboard">الصفحة الرئيسية</span>
                </button>
                <button onclick="switchTab('students', this)" class="sidebar-link w-full text-right flex items-center gap-3 px-4 py-2.5 rounded-lg text-green-100 hover:bg-green-800 hover:text-white transition-all">
                    <i class="fa-solid fa-user-graduate text-base w-5 text-center"></i>
                    <span class="nav-text text-sm" data-key="students">إدارة الطلاب</span>
                </button>
                <button onclick="switchTab('teachers', this)" class="sidebar-link w-full text-right flex items-center gap-3 px-4 py-2.5 rounded-lg text-green-100 hover:bg-green-800 hover:text-white transition-all">
                    <i class="fa-solid fa-chalkboard-user text-base w-5 text-center"></i>
                    <span class="nav-text text-sm" data-key="teachers">اساتذہ ڈائریکٹری</span>
                </button>
                <button onclick="switchTab('staff', this)" class="sidebar-link w-full text-right flex items-center gap-3 px-4 py-2.5 rounded-lg text-green-100 hover:bg-green-800 hover:text-white transition-all">
                    <i class="fa-solid fa-users text-base w-5 text-center"></i>
                    <span class="nav-text text-sm" data-key="staff">عملہ رجسٹر</span>
                </button>
                <button onclick="switchTab('donations', this)" class="sidebar-link w-full text-right flex items-center gap-3 px-4 py-2.5 rounded-lg text-green-100 hover:bg-green-800 hover:text-white transition-all">
                    <i class="fa-solid fa-hand-holding-heart text-base w-5 text-center"></i>
                    <span class="nav-text text-sm" data-key="donations">عطیات رجسٹر</span>
                </button>
                <button onclick="switchTab('attendance', this)" class="sidebar-link w-full text-right flex items-center gap-3 px-4 py-2.5 rounded-lg text-green-100 hover:bg-green-800 hover:text-white transition-all">
                    <i class="fa-solid fa-calendar-check text-base w-5 text-center"></i>
                    <span class="nav-text text-sm" data-key="attendance">حاضری کا ریکارڈ</span>
                </button>
                <button onclick="switchTab('finance', this)" class="sidebar-link w-full text-right flex items-center gap-3 px-4 py-2.5 rounded-lg text-green-100 hover:bg-green-800 hover:text-white transition-all">
                    <i class="fa-solid fa-file-invoice-dollar text-base w-5 text-center"></i>
                    <span class="nav-text text-sm" data-key="finance">مالیاتی امور</span>
                </button>
                <button onclick="switchTab('academics', this)" class="sidebar-link w-full text-right flex items-center gap-3 px-4 py-2.5 rounded-lg text-green-100 hover:bg-green-800 hover:text-white transition-all">
                    <i class="fa-solid fa-book-quran text-base w-5 text-center"></i>
                    <span class="nav-text text-sm" data-key="academics">تعلیمی نصاب</span>
                </button>
                <button onclick="switchTab('rewards', this)" class="sidebar-link w-full text-right flex items-center gap-3 px-4 py-2.5 rounded-lg text-green-100 hover:bg-green-800 hover:text-white transition-all">
                    <i class="fa-solid fa-award text-base w-5 text-center"></i>
                    <span class="nav-text text-sm" data-key="rewards">بیجز اور انعامات</span>
                </button>
                <button onclick="switchTab('gallery', this)" class="sidebar-link w-full text-right flex items-center gap-3 px-4 py-2.5 rounded-lg text-green-100 hover:bg-green-800 hover:text-white transition-all">
                    <i class="fa-solid fa-images text-base w-5 text-center"></i>
                    <span class="nav-text text-sm" data-key="gallery">میڈیا گیلری</span>
                </button>
                <button onclick="switchTab('communication', this)" class="sidebar-link w-full text-right flex items-center gap-3 px-4 py-2.5 rounded-lg text-green-100 hover:bg-green-800 hover:text-white transition-all">
                    <i class="fa-solid fa-comments text-base w-5 text-center"></i>
                    <span class="nav-text text-sm" data-key="communication">غرفة التواصل</span>
                </button>
            </nav>
        </div>

        <div class="p-4 border-t border-green-800">
            <div class="flex items-center justify-between bg-green-950 p-2 rounded-lg border border-green-800">
                <button onclick="setLanguage('ur')" class="text-xs font-semibold px-2 py-1 rounded transition hover:bg-secondary hover:text-primary">اردو</button>
                <button onclick="setLanguage('ar')" class="text-xs font-semibold px-2 py-1 rounded transition hover:bg-secondary hover:text-primary bg-secondary text-primary">العربية</button>
                <button onclick="setLanguage('en')" class="text-xs font-semibold px-2 py-1 rounded transition hover:bg-secondary hover:text-primary">English</button>
            </div>
        </div>
    </aside>

    <!-- MAIN DASHBOARD CONTENT AREA -->
    <main class="flex-grow flex flex-col min-h-screen bg-bgLight">
        <!-- TOP NAVIGATION BAR -->
        <header class="bg-primary text-white px-6 py-4 flex items-center justify-between shadow-md">
            <div class="flex items-center gap-4">
                <button class="md:hidden text-white focus:outline-none p-2 min-w-[48px]" onclick="toggleMobileMenu()">
                    <i class="fa-solid fa-bars text-xl"></i>
                </button>
                <div class="relative hidden sm:block">
                    <input type="text" id="search-input" placeholder="بحث..." class="bg-green-950/40 text-white placeholder-green-200 border border-green-800/60 rounded-full py-2 px-4 pr-10 focus:outline-none focus:ring-2 focus:ring-secondary text-sm w-64">
                    <i class="fa-solid fa-magnifying-glass absolute top-3 right-3 text-secondary text-xs"></i>
                </div>
            </div>

            <!-- Role Selector -->
            <div class="flex items-center gap-2 bg-green-950/60 p-1.5 rounded-full border border-green-800/80">
                <button id="role-btn-admin" onclick="setRole('admin')" class="role-tab-btn text-xs font-medium px-3 py-1.5 rounded-full transition-all bg-secondary text-white min-h-[36px]" data-key="roleAdmin">إدمن</button>
                <button id="role-btn-teacher" onclick="setRole('teacher')" class="role-tab-btn text-xs font-medium px-3 py-1.5 rounded-full transition-all bg-gray-200 text-darkNeutral min-h-[36px]" data-key="roleTeacher">استاد</button>
                <button id="role-btn-student" onclick="setRole('student')" class="role-tab-btn text-xs font-medium px-3 py-1.5 rounded-full transition-all bg-gray-200 text-darkNeutral min-h-[36px]" data-key="roleStudent">طالب علم</button>
                <button id="role-btn-parent" onclick="setRole('parent')" class="role-tab-btn text-xs font-medium px-3 py-1.5 rounded-full transition-all bg-gray-200 text-darkNeutral min-h-[36px]" data-key="roleParent">والدین</button>
            </div>

            <!-- Profile & Notifications -->
            <div class="flex items-center gap-3">
                <button class="bg-green-950/40 p-2 rounded-full relative min-w-[44px]">
                    <i class="fa-solid fa-bell text-secondary text-sm"></i>
                    <span class="absolute top-1 right-1 w-2.5 h-2.5 bg-red-500 rounded-full"></span>
                </button>
                <div class="flex items-center gap-2 border-l border-green-800 pl-3">
                    <img src="https://images.unsplash.com/photo-1534528741775-53994a69daeb?auto=format&fit=crop&q=80&w=100" class="w-9 h-9 rounded-full border border-secondary object-cover">
                </div>
            </div>
        </header>

        <!-- PORTAL CONTENT VIEWS - Fixed padding and overflow to prevent font cutoff -->
        <div class="p-6 md:p-8 flex-grow space-y-8 overflow-y-auto max-w-full" id="main-content-container">
            <!-- Content will be injected dynamically via JS based on the active tab -->
        </div>
    </main>

    <!-- MODAL FOR DATA ENTRY -->
    <div id="data-modal" class="fixed inset-0 bg-black/50 z-50 flex items-center justify-center hidden">
        <div class="bg-white rounded-2xl p-6 w-full max-w-md mx-4 space-y-4">
            <div class="flex justify-between items-center border-b pb-2">
                <h3 class="text-lg font-bold text-primary" id="modal-title">نیا ریکارڈ شامل کریں</h3>
                <button onclick="closeModal()" class="text-gray-400 hover:text-gray-600"><i class="fa-solid fa-xmark text-lg"></i></button>
            </div>
            <div id="modal-form-fields" class="space-y-3">
                <!-- Inputs injected dynamically -->
            </div>
            <div class="flex justify-end gap-2 border-t pt-3">
                <button onclick="closeModal()" class="bg-gray-200 text-darkNeutral px-4 py-2 rounded-lg text-xs">منسوخ کریں</button>
                <button onclick="submitModalForm()" class="bg-primary text-white px-4 py-2 rounded-lg text-xs font-semibold">محفوظ کریں</button>
            </div>
        </div>
    </div>

    <!-- ID CARD MODAL -->
    <div id="id-card-modal" class="fixed inset-0 bg-black/50 z-50 flex items-center justify-center hidden">
        <div class="bg-white rounded-2xl p-6 w-full max-w-md mx-4 space-y-4">
            <div class="flex justify-between items-center border-b pb-2">
                <h3 class="text-base font-bold text-primary" id="card-modal-title">سروس کارڈ / شناختی کارڈ</h3>
                <button onclick="closeCardModal()" class="text-gray-400 hover:text-gray-600"><i class="fa-solid fa-xmark text-lg"></i></button>
            </div>
            
            <!-- Service Card Design -->
            <div id="service-card-print-area" class="border-2 border-secondary bg-white rounded-xl overflow-hidden shadow-md max-w-sm mx-auto text-right" style="direction: rtl;">
                <div class="bg-primary p-3 text-center text-white border-b border-secondary">
                    <h4 class="font-bold text-secondary text-sm">جامعہ الفرقان</h4>
                    <p class="text-[9px] tracking-widest text-green-200 mt-0.5">JAMIA AL-FURQAN — SERVICE CARD</p>
                </div>
                
                <div class="p-4 grid grid-cols-3 gap-4">
                    <!-- Left info table -->
                    <div class="col-span-2 text-xs space-y-1.5" id="card-details-table">
                        <!-- Injected dynamically -->
                    </div>
                    
                    <!-- Right Photo Box -->
                    <div class="flex flex-col items-center justify-center border border-dashed border-gray-300 rounded-lg p-2 bg-gray-50 h-28">
                        <span class="text-gray-400 text-[10px] text-center" id="card-photo-text">تصویر نہیں</span>
                    </div>
                </div>
                
                <div class="bg-gray-100 p-2 text-center text-[10px] text-gray-500 border-t border-gray-200 flex justify-between px-4">
                    <span id="card-session-text">سیشن: 1447-48</span>
                    <span id="card-number-text">نمبر: 10</span>
                </div>
            </div>

            <div class="flex justify-end gap-2 border-t pt-3">
                <button onclick="closeCardModal()" class="bg-gray-200 text-darkNeutral px-4 py-2 rounded-lg text-xs">بند کریں</button>
                <button onclick="printCard()" class="bg-secondary text-primary font-bold px-4 py-2 rounded-lg text-xs">پرنٹ کریں</button>
            </div>
        </div>
    </div>

    <!-- TAB RENDER ENGINE -->
    <script src="js/render.js"></script>
</body>
</html>
